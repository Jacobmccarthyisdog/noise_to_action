name: Generate Dashboard Data

on:
  workflow_dispatch:

  schedule:
    # Refreshes the Vercel dashboard data artifact every 6 hours.
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  generate-dashboard-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate daily AI insight
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
        run: |
          python jobs/generate_daily_insight.py --force

      - name: Export web dashboard data
        run: |
          python jobs/export_dashboard_data.py

      - name: Commit updated dashboard artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet data/daily_insight.json web/public/data/dashboard.json; then
            echo "No changes to commit."
          else
            git add data/daily_insight.json web/public/data/dashboard.json
            git commit -m "Update dashboard data"
            git push
          fi
