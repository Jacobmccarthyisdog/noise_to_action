name: Generate Dashboard Data

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/generate_daily_insight.yml"
      - "calculations.py"
      - "data_loader.py"
      - "config.py"
      - "insights.py"
      - "jobs/**"
      - "requirements.txt"

  schedule:
    # GitHub cron runs in UTC. The Python guard below converts to America/Chicago
    # and refreshes only at 8am, noon, and 3pm Central on trading weekdays.
    - cron: "0 13-22 * * 1-5"

permissions:
  contents: write

jobs:
  generate-dashboard-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check market refresh window
        id: market_window
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          import os

          now = datetime.now(ZoneInfo("America/Chicago"))
          today = now.date()

          def observed_new_year(year):
              day = datetime(year, 1, 1).date()
              if day.weekday() == 5:
                  return datetime(year - 1, 12, 31).date()
              if day.weekday() == 6:
                  return datetime(year, 1, 2).date()
              return day

          def observed_juneteenth(year):
              day = datetime(year, 6, 19).date()
              if day.weekday() == 5:
                  return datetime(year, 6, 18).date()
              if day.weekday() == 6:
                  return datetime(year, 6, 20).date()
              return day

          def observed_independence_day(year):
              day = datetime(year, 7, 4).date()
              if day.weekday() == 5:
                  return datetime(year, 7, 3).date()
              if day.weekday() == 6:
                  return datetime(year, 7, 5).date()
              return day

          def observed_christmas(year):
              day = datetime(year, 12, 25).date()
              if day.weekday() == 5:
                  return datetime(year, 12, 24).date()
              if day.weekday() == 6:
                  return datetime(year, 12, 26).date()
              return day

          def nth_weekday(year, month, weekday, n):
              day = datetime(year, month, 1).date()
              offset = (weekday - day.weekday()) % 7
              return day.replace(day=1 + offset + 7 * (n - 1))

          def last_weekday(year, month, weekday):
              if month == 12:
                  day = datetime(year + 1, 1, 1).date()
              else:
                  day = datetime(year, month + 1, 1).date()
              day = day - timedelta(days=1)
              while day.weekday() != weekday:
                  day = day - timedelta(days=1)
              return day

          def easter_date(year):
              a = year % 19
              b = year // 100
              c = year % 100
              d = b // 4
              e = b % 4
              f = (b + 8) // 25
              g = (b - f + 1) // 3
              h = (19 * a + b - d - g + 15) % 30
              i = c // 4
              k = c % 4
              l = (32 + 2 * e + 2 * i - h - k) % 7
              m = (a + 11 * h + 22 * l) // 451
              month = (h + l - 7 * m + 114) // 31
              day = ((h + l - 7 * m + 114) % 31) + 1
              return datetime(year, month, day).date()

          year = today.year
          holidays = {
              observed_new_year(year),
              nth_weekday(year, 1, 0, 3),
              nth_weekday(year, 2, 0, 3),
              easter_date(year) - timedelta(days=2),
              last_weekday(year, 5, 0),
              observed_juneteenth(year),
              observed_independence_day(year),
              nth_weekday(year, 9, 0, 1),
              nth_weekday(year, 11, 3, 4),
              observed_christmas(year),
          }

          refresh_hours_ct = {8, 12, 15}
          is_weekday = now.weekday() < 5
          is_holiday = today in holidays
          is_refresh_hour = now.hour in refresh_hours_ct
          should_run = is_weekday and not is_holiday and is_refresh_hour

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should_run={'true' if should_run else 'false'}\n")

          print(f"now_ct={now.isoformat()}")
          print(f"is_weekday={is_weekday} is_holiday={is_holiday} is_refresh_hour={is_refresh_hour}")
          print(f"refresh_hours_ct={sorted(refresh_hours_ct)}")
          print(f"should_run={should_run}")
          PY

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.market_window.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate daily AI insight
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.market_window.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
        run: |
          python jobs/generate_daily_insight.py --force

      - name: Export web dashboard data
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.market_window.outputs.should_run == 'true'
        run: |
          python jobs/export_dashboard_data.py

      - name: Commit updated dashboard artifacts
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.market_window.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet data/daily_insight.json web/public/data/dashboard.json; then
            echo "No changes to commit."
          else
            git add data/daily_insight.json web/public/data/dashboard.json
            git commit -m "Update dashboard data"
            git push
          fi
