name: Generate Daily Insight

on:
  workflow_dispatch:
    inputs:
      run_type:
        description: "Type of insight to generate"
        required: true
        default: "manual"
        type: choice
        options:
          - manual
          - premarket
          - postclose

  schedule:
    # 9:00 AM Eastern during daylight saving time
    # 30 minutes before market open
    - cron: "0 13 * * 1-5"

    # 4:30 PM Eastern during daylight saving time
    # 30 minutes after market close
    - cron: "30 20 * * 1-5"

permissions:
  contents: write

jobs:
  generate-insight:
    runs-on: ubuntu-latest

    steps:
      - name: Determine run type
        id: run_type
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.run_type }}" >> "$GITHUB_OUTPUT"
          else
            current_hour="$(date -u +%H)"
            if [ "$current_hour" = "13" ]; then
              echo "value=premarket" >> "$GITHUB_OUTPUT"
            else
              echo "value=postclose" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate daily insight
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: python jobs/generate_daily_insight.py --force --run-type ${{ steps.run_type.outputs.value }}

      - name: Commit updated insight artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily_insight.json
          git diff --cached --quiet || git commit -m "Update daily insight artifact"
          git push
