name: Generate Daily Insight

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate even if today's OpenAI insight already exists"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      allow_placeholder:
        description: "Write placeholder JSON if OpenAI fails"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    - cron: "30 22 * * 1-5"

permissions:
  contents: write

jobs:
  generate-daily-insight:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: milestone-3-llm-insights

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Verify OpenAI API key
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not set. Add it in GitHub repo Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi

      - name: Generate daily insight
        run: |
          FORCE_FLAG=""
          PLACEHOLDER_FLAG=""

          if [ "${{ github.event.inputs.force || 'true' }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi

          if [ "${{ github.event.inputs.allow_placeholder || 'false' }}" = "true" ]; then
            PLACEHOLDER_FLAG="--allow-placeholder"
          fi

          python jobs/generate_daily_insight.py $FORCE_FLAG $PLACEHOLDER_FLAG

      - name: Validate generated JSON
        run: |
          python -m json.tool data/daily_insight.json > /tmp/daily_insight_validated.json
          cp /tmp/daily_insight_validated.json data/daily_insight.json
          cat data/daily_insight.json

      - name: Commit generated insight
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/daily_insight.json

          if git diff --cached --quiet; then
            echo "No daily insight changes to commit."
            exit 0
          fi

          git commit -m "Update daily AI insight"
          git push origin HEAD:milestone-3-llm-insights
